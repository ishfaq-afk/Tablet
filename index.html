<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tablet Lock</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background:#0f1626; color:#e8edf7;
         margin:0; display:flex; min-height:100vh; align-items:center; justify-content:center; padding:20px; }
  .card { background:#182238; padding:24px; border-radius:16px; width:min(440px,94vw);
          box-shadow:0 10px 40px rgba(0,0,0,.4); }
  input { width:100%; box-sizing:border-box; padding:12px; border-radius:9px;
          border:1px solid #2c3a57; background:#0f1626; color:#e8edf7; font-size:14px; margin-bottom:12px; }
  .row { display:flex; gap:12px; margin-top:12px; }
  button { flex:1; padding:16px; border:0; border-radius:12px; font-size:22px;
           font-weight:700; cursor:pointer; color:#fff; }
  .lock { background:#e04a4a; } .unlock { background:#3ba55d; }
  .timer { background:#e0913a; } .happy { background:#e6b400; }
  .sad { background:#4a72e0; } .msg { background:#2c3a57; } .wlp { background:#5a3aa0; }
  .hide { background:#444c5e; } .show { background:#607089; }
  .full { width:100%; margin-top:12px; }
  .dots { display:flex; gap:26px; justify-content:center; margin:16px 0; }
  .dot { width:30px; height:30px; border-radius:50%; border:3px solid; }
  .dot.red { border-color:#e04a4a; } .dot.green { border-color:#3ba55d; }
  .dot.red.on { background:#e04a4a; box-shadow:0 0 16px #e04a4a; }
  .dot.green.on { background:#3ba55d; box-shadow:0 0 16px #3ba55d; }
</style>
</head>
<body>
<div class="card">
  <input id="deviceId" placeholder="Device ID" />

  <div class="dots">
    <div id="dotRed" class="dot red"></div>
    <div id="dotGreen" class="dot green"></div>
  </div>

  <div class="row">
    <button class="lock" onclick="lockNow()"></button>
    <button class="unlock" onclick="unlockNow()"></button>
  </div>

  <div class="row">
    <button class="happy" onclick="setMood('happy')"></button>
    <button class="sad" onclick="setMood('sad')"></button>
  </div>

  <input id="minutes" type="number" min="1" placeholder="minutes" style="margin-top:12px" />
  <button class="timer full" onclick="lockWithTimer()"></button>

  <input id="message" placeholder="message" style="margin-top:16px" />
  <button class="msg full" onclick="setMessage()"></button>

  <input id="wp" placeholder="wallpaper url" style="margin-top:12px" />
  <button class="wlp full" onclick="setWallpaper()"></button>

  <div class="row">
    <button class="hide" onclick="setHidden(true)"></button>
    <button class="show" onclick="setHidden(false)"></button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, update, onValue }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD-HOZHomaEaFx4pPZcfBSyZC5mVFQnwcI",
    authDomain: "tablets-health.firebaseapp.com",
    databaseURL: "https://tablets-health-default-rtdb.firebaseio.com",
    projectId: "tablets-health",
    storageBucket: "tablets-health.firebasestorage.app",
    messagingSenderId: "838186907219",
    appId: "1:838186907219:web:fa1276230de1e620e438a6",
    measurementId: "G-0NCP002F1H"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const idInput = document.getElementById("deviceId");
  const dotRed = document.getElementById("dotRed");
  const dotGreen = document.getElementById("dotGreen");
  let unsub = null;

  const saved = localStorage.getItem("deviceId");
  if (saved) idInput.value = saved;
  function base() { return "devices/" + idInput.value.trim(); }

  function watch() {
    const id = idInput.value.trim();
    localStorage.setItem("deviceId", id);
    if (unsub) unsub();
    if (!id) { dotRed.classList.remove("on"); dotGreen.classList.remove("on"); return; }
    unsub = onValue(ref(db, base()), (snap) => {
      const v = snap.val() || {};
      dotRed.classList.toggle("on", v.locked === true);
      dotGreen.classList.toggle("on", v.locked === false);
    });
  }
  idInput.addEventListener("change", watch);
  watch();

  window.lockNow = () => update(ref(db, base()), { locked: true, unlockAt: 0, mood: "none" });
  window.unlockNow = () => update(ref(db, base()), { locked: false, unlockAt: 0, mood: "none" });
  window.setMood = (m) => update(ref(db, base()), { locked: true, unlockAt: 0, mood: m });
  window.lockWithTimer = () => {
    const min = parseInt(document.getElementById("minutes").value, 10);
    if (!min || min < 1) return;
    update(ref(db, base()), { locked: true, unlockAt: Date.now() + min * 60000, mood: "none" });
  };
  window.setMessage = () => set(ref(db, base() + "/message"), document.getElementById("message").value);
  window.setWallpaper = () => {
    const url = document.getElementById("wp").value.trim();
    if (url) set(ref(db, base() + "/wallpaperUrl"), url);
  };
  window.setHidden = (h) => set(ref(db, base() + "/hidden"), h);
</script>
</body>
</html>
